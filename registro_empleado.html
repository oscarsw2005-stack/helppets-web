<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelpPets - Registro de empleado</title>
    <!-- Enlace a FontAwesome para iconos -->
    <link rel="stylesheet" href="estilos/rgis_empleado.css">
</head>
<body>

    <div class="browser-mockup">
        <!-- Barra de Navegación simulada del navegador -->
        <div class="browser-header">
            <div class="browser-tabs">
                <span class="tab active"><i class="fa-regular fa-file"></i> A Web Page</span>
            </div>
            <div class="browser-address-bar">
                <div class="nav-buttons">
                    <i class="fa-solid fa-arrow-left"></i>
                    <i class="fa-solid fa-arrow-right"></i>
                    <i class="fa-solid fa-rotate-right"></i>
                </div>
                <div class="url-input">https://HelpPets.com</div>
            </div>
        </div>

        <!-- Contenido de la Web -->
        <div class="main-container">
            <!-- Franja Superior -->
            <header class="top-bar">
                <h2><i class="fa-regular fa-user"></i> Registro de empleado</h2>
            </header>

            <!-- Cuerpo Principal con el Formulario -->
            <section class="content-body-registro">
                <div class="form-card">
                    <!-- Logo pequeño flotante superior (HelpPets) -->
                    <div class="mini-logo">
                        <i class="fa-solid fa-dog"></i>
                        <span>HELP PETS</span>
                    </div>

                    <h3 class="form-title">Registrar</h3>

                    <form>
                        <div class="form-group">
                            <label>Nombres</label>
                            <input type="text" value="Oscar Daniel" readonly>
                        </div>

                        <div class="form-group">
                            <label>Apellidos</label>
                            <input type="text" value="Hernández Rojas" readonly>
                        </div>

                        <div class="form-group">
                            <label>Correo</label>
                            <input type="text" value="petito@hotmail.com" readonly>
                        </div>

                        <div class="form-group">
                            <label>Tipo de documento</label>
                            <select disabled>
                                <option>ComboBox</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Documento</label>
                            <input type="text" value="1021901" readonly>
                        </div>

                        <div class="form-group">
                            <label>Direccion</label>
                            <input type="text" value="cra 108 55b 16" readonly>
                        </div>

                        <div class="form-group">
                            <label>Contraseña</label>
                            <input type="password" value="******" readonly>
                        </div>

                        <div class="form-group">
                            <label>Confirmar contraseña</label>
                            <input type="password" value="******" readonly>
                        </div>

                        <div class="form-group">
                            <label>Rol</label>
                            <select disabled>
                                <option>ComboBox</option>
                            </select>
                        </div>

                        <button type="button" class="btn-registrar">Registrar</button>
                    </form>
                </div>
            </section>

            <!-- Pie de Página (Footer) -->
            <footer class="footer-bar">
                <p>Contacto: info@veterinaria.com | Teléfono: 123-456-7890</p>
                <p>&copy; 2026</p>
            </footer>
        </div>
    </div>

</body>
</html>
