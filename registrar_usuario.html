<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelpPets - Registrar Usuario</title>
    <link rel="stylesheet" href="estilos/estilo_usuario.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <header class="navbar">
        <div class="navbar-brand">
            <i data-lucide="star" class="navbar-icon"></i>
            <span>Registrar Usuario</span>
        </div>
    </header>

    <main class="main-container">
        <section class="logo-section">
            <div class="logo-circle">
                <img src="estilos/veterinaria.webp" alt="Logo Veterinaria">
            </div>
        </section>

        <section class="options-section registration-card">
            <h2>Registrar Usuario</h2>

            <form action="./registrar_usuario.php" method="POST">
                
                <div class="grupo-campo">
                    <label for="documento">Documento:</label>
                    <input type="text" id="documento" name="documento" placeholder="Ingresa tu documento" required>
                </div>

                <div class="grupo-campo">
                    <label for="nombre">Nombre completo:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ingresa tu nombre completo" required>
                </div>

                <div class="grupo-campo">
                    <label for="correo">Correo electrónico:</label>
                    <input type="email" id="correo" name="correo" placeholder="Ingresa tu correo electrónico" required>
                </div>

                <div class="grupo-campo">
                    <label for="telefono">Teléfono:</label>
                    <input type="tel" id="telefono" name="telefono" placeholder="Ingresa tu número de teléfono" required>
                </div>

                <div class="grupo-campo">
                    <label for="contrasena">Contraseña:</label>
                    <input type="password" id="contrasena" name="contrasena" placeholder="Crea una contraseña" required>
                </div>

                <div class="enlaces-extra">
                    <a href="index.html">¿Ya tienes cuenta? Inicia sesión</a>
                </div>

                <button type="submit" class="option-btn registration-submit">Registrarse</button>
                
            </form>
        </section>
    </main>

    <footer class="footer">
        <p>Contacto: info@veterinaria.com | Teléfono: 123-456-7890</p>
        <p>© 2026</p>
    </footer>

    <script>
        lucide.createIcons();
    </script>

</body>
</html>
