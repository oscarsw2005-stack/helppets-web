<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelpPets - Validación de Cuenta</title>
    <link rel="stylesheet" href="estilos/validacion_cuenta.css">
</head>
<body class="bg-pattern">

    <!-- Contenedor principal estilo ventana de navegador -->
    <div class="web-page-container">

        <!-- Franja Superior (Cabecera) -->
        <header class="top-bar">
            <div class="options-title">
                Validacion
            </div>
        </header>

        <!-- Cuerpo central con el formulario de validación -->
        <main class="main-content">
            <div class="form-card-container">
                
                <h2 class="form-heading">Ingrese el documento vinculado a la cuenta</h2>

                <form action="diagrama1_login_cliente.html" method="POST">
                    
                    <div class="form-group">
                        <label for="documento">Documento</label>
                        <input type="text" id="documento" placeholder="Ingrese su documento" required>
                    </div>

                    <button type="submit" class="btn-submit">enviar</button>

                </form>
            </div>
        </main>

    </div>

</body>
</html>
