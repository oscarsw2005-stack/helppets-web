<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelpPets - Registro Exitoso</title>
    <link rel="stylesheet" href="estilos/estilo_registro.css">
    <style>
        /* Estilos específicos para la pantalla de éxito (puedes pasarlos a estilos.css) */
        .tarjeta-exito {
            text-align: center;
        }

        .icono-check {
            width: 72px;
            height: 72px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background-color: #dcfce7;
            color: #16a34a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            font-weight: bold;
        }

        .mensaje-exito {
            font-size: 0.95rem;
            color: #4b5563;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .btn-enlace {
            display: inline-block;
            text-decoration: none;
            text-align: center;
        }
    </style>
</head>
<body>

    <header class="encabezado">
        <div class="titulo-header">
            <span class="icono-usuario">👤</span>
            <h1>Registro de Usuario</h1>
        </div>
    </header>

    <main class="contenedor-principal">
        <div class="tarjeta-formulario tarjeta-exito">
            
            <div class="logo-flotante">
                <img src="estilos/veterinaria.webp" alt="Logo HelpPets">
            </div>

            <div class="icono-check">✓</div>

            <h2>¡Registro Exitoso!</h2>

            <p class="mensaje-exito">
                Tu cuenta ha sido creada correctamente en <strong>HelpPets</strong>. Ya puedes iniciar sesión con tu documento y contraseña.
            </p>

            <a href="index.html" class="btn-principal btn-enlace">Ir a Iniciar Sesión</a>
            
        </div>
    </main>

    <footer class="pie-pagina">
        <p>Contacto: info@veterinaria.com | Teléfono: 123-456-7890</p>
        <p>© 2026</p>
    </footer>

</body>
</html>
