<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Inicio de Sesión - Help Pets</title>

  <link rel="stylesheet" href="estilos/inicio_sesion.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

  <!-- Encabezado -->
  <header class="header-banner">
    <div class="header-content">
      <i data-lucide="user" class="user-icon"></i>
      <h1>Inicio de Sesión</h1>
    </div>
  </header>

  <!-- Contenido principal -->
  <main class="main-container">
    <div class="login-card-container">

      <!-- Logo -->
      <div class="logo-badge">
        <img
          src="https://via.placeholder.com/80?text=HELP+PETS"
          alt="Help Pets Logo"
        >
      </div>

      <!-- Formulario -->
      <div class="login-card">
        <h2 class="card-title">Iniciar Sesión</h2>

        <form action="panel_cliente.html" method="get" class="login-form">

          <div class="form-group">
            <label for="documento">Documento:</label>
            <input
              type="text"
              id="documento"
              name="documento"
              placeholder="Ingresa tu documento"
              required
              title="Ingresa tu documento usando solo números"
            >
          </div>

          <div class="form-group">
            <label for="password">Contraseña:</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Ingresa tu contraseña"
              required
            >
          </div>

          <div class="links-group">
            <a href="registro.html" class="link-left">
              Registrar usuario
            </a>

            <a href="validacion_cuenta.html" class="link-right">
              ¿Olvidaste tu contraseña?
            </a>
          </div>

          <button type="submit" class="btn-submit">
            Entrar
          </button>

        </form>
      </div>
    </div>
  </main>

  <!-- Pie de página -->
  <footer class="footer-banner">
    <p>
      Contacto: info@veterinaria.com |
      Teléfono: 123-456-7890
    </p>
    <p>© 2026</p>
  </footer>

  <script>
    lucide.createIcons();
  </script>

</body>
</html>
