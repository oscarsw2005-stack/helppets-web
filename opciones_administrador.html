<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelpPets - Panel de Opciones</title>
    <!-- Enlace a los iconos de FontAwesome para las huellas, candado, etc. -->
    <link rel="stylesheet" href="estilos/opciones_administrador.css">
</head>
<body>

    <div class="browser-mockup">
        <!-- Barra de Navegación simulada del navegador -->
        <div class="browser-header">
            <div class="browser-tabs">
                <span class="tab active"><i class="fa-regular fa-file"></i> A Web Page</span>
            </div>
            <div class="browser-address-bar">
                <div class="nav-buttons">
                    <i class="fa-solid fa-arrow-left"></i>
                    <i class="fa-solid fa-arrow-right"></i>
                    <i class="fa-solid fa-rotate-right"></i>
                </div>
                <div class="url-input">https://HelpPets.com</div>
            </div>
        </div>

        <!-- Contenido de la Web -->
        <div class="main-container">
            <!-- Franja Superior -->
            <header class="top-bar">
                <h2><i class="fa-regular fa-star"></i> Opciones</h2>
            </header>

            <!-- Cuerpo Principal con Fondo de Huellas -->
            <section class="content-body">
                <!-- Lado Izquierdo: Logo Veterinario -->
                <div class="logo-container">
                    <div class="vet-logo-placeholder">
                        <i class="fa-solid fa-dog dog-icon"></i>
                        <i class="fa-solid fa-cat cat-icon"></i>
                        <div class="cross-badge">
                            <i class="fa-solid fa-plus"></i>
                        </div>
                    </div>
                </div>

                <!-- Lado Derecho: Botones de Opciones -->
                <div class="buttons-container">
                    <button class="btn btn-blue">
                        <i class="fa-solid fa-paw"></i> Registrar nuevo empleado
                    </button>
                    <button class="btn btn-blue">
                        <i class="fa-solid fa-paw"></i> Gestion De Roles
                    </button>
                    <button class="btn btn-blue">
                        <i class="fa-solid fa-rotate"></i> Reportes
                    </button>
                    <button class="btn btn-blue">
                        <i class="fa-solid fa-paw"></i> Horarios
                    </button>
                    <button class="btn btn-red">
                        <i class="fa-solid fa-lock"></i> Cerrar sesión
                    </button>
                </div>
            </section>

            <!-- Pie de Página (Footer) -->
            <footer class="footer-bar">
                <p>Contacto: info@veterinaria.com | Teléfono: 123-456-7890</p>
                <p>&copy; 2023 Veterinaria. Todos los derechos reservados.</p>
            </footer>
        </div>
    </div>

</body>
</html>
