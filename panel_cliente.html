<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelpPets - Opciones Cliente</title>
    <link rel="stylesheet" href="estilos_panel_cliente.css">
    <!-- Iconos Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-pattern">

    <!-- Contenedor principal tipo ventana de navegador -->
    <div class="web-page-container">

        <!-- Barra de Dirección de Navegador simulada -->
        <div class="browser-address-bar">
            <span class="browser-dots"></span>
            <div class="browser-url-box">
                <span class="browser-url">https://HelpPets.com</span>
            </div>
        </div>

        <!-- Franja Superior Azul ("Opciones") -->
        <header class="top-bar">
            <div class="top-bar-title">
                <i data-lucide="star" class="star-icon"></i>
                <h1>Opciones</h1>
            </div>
        </header>

        <!-- Cuerpo central con la imagen grande y los botones abajo/alineados -->
        <main class="main-content">
            <div class="content-layout">
                
                <!-- Imagen grande del perro y gato -->
                <div class="logo-section">
                    <img src="estilos/perro_gato_fondo.png" alt="HelpPets Logo Perro y Gato" class="pet-logo-large">
                </div>

                <!-- Menú de opciones del cliente -->
                <div class="options-menu">
                    
                    <a href="solicitud_cita.html" class="btn-option btn-blue">
                        <i data-lucide="paw-print" class="btn-icon"></i>
                        <span>Solicitar cita</span>
                    </a>

                    <a href="historial_clinico.html" class="btn-option btn-blue">
                        <i data-lucide="paw-print" class="btn-icon"></i>
                        <span>HISTORIAL CLINICO</span>
                    </a>

                    <a href="actualizacion_datos.html" class="btn-option btn-light-blue">
                        <i data-lucide="refresh-cw" class="btn-icon"></i>
                        <span>Actualizar datos</span>
                    </a>

                    <a href="registro_mascota.html" class="btn-option btn-light-blue">
                        <i data-lucide="paw-print" class="btn-icon"></i>
                        <span>Registrar mascota</span>
                    </a>

                    <a href="index.html" class="btn-option btn-red">
                        <i data-lucide="lock" class="btn-icon"></i>
                        <span>Cerrar sesión</span>
                    </a>

                </div>

            </div>
        </main>

        <!-- Pie de página -->
        <footer class="footer-banner">
            <p>Contacto: info@veterinaria.com | Teléfono: 123-456-7890</p>
            <p>© 2023 Veterinaria. Todos los derechos reservados.</p>
        </footer>

    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
