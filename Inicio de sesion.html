<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelpPets - Inicio de Sesión Cliente</title>
    <link rel="stylesheet" href="estilos_diagrama1.css">
</head>
<body class="bg-login">

    <div class="login-card">
        <div class="logo-container">
            <span class="logo-text">HELP PETS</span>
        </div>

        <h2>Iniciar Sesión</h2>

        <form action="#" method="POST">
            <div class="form-group">
                <label for="documento">Documento</label>
                <input type="text" id="documento" placeholder="10*****" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" placeholder="********" required>
            </div>

            <div class="links-group">
                <a href="diagrama3_registro_cliente.html">Registrar usuario</a>
                <a href="diagrama5_validacion_cuenta.html">¿Olvidaste tu contraseña?</a>
            </div>

            <button type="submit" class="btn-primary">Entrar</button>
        </form>

        <footer class="login-footer">
            <p>Contacto: info@veterinaria.com | Teléfono: 123-456-7890</p>
            <p>© 2026 HelpPets</p>
        </footer>
    </div>

</body>
</html>
