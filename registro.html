<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelpPets - Registro de Cliente</title>
    <link rel="stylesheet" href="estilos/registro.css">
</head>
<body class="bg-pattern">

    <!-- Contenedor principal estilo ventana de navegador -->
    <div class="web-page-container">

        <!-- Franja Superior (Cabecera) -->
        <header class="top-bar">
            <div class="options-title">
                <span class="user-icon">👤</span> Registro de cliente
            </div>
            <!-- Botón Volver al Inicio que redirige al panel -->
            <a href="index.html" class="btn-volver">Volver al Inicio</a>
        </header>

        <!-- Cuerpo central con el formulario de registro -->
        <main class="main-content">
            <div class="form-card-container">
                
                <!-- Logotipo flotante en la esquina superior derecha del formulario -->
                <div class="form-logo-badge">
                    <div class="logo-circle">
                        <span>HELP PETS</span>
                    </div>
                </div>

                <h2 class="form-heading">Registrarse</h2>

                <form action="registrar_usuario.php" method="POST">
                    
                    <div class="form-group">
                        <label for="nombres">Nombres</label>
                        <input type="text" id="nombres" name="nombres" placeholder="Oscar Daniel" maxlength="100" required>
                    </div>

                    <div class="form-group">
                        <label for="apellidos">Apellidos</label>
                        <input type="text" id="apellidos" name="apellidos" placeholder="Hernández Rojas" maxlength="100" required>
                    </div>

                    <div class="form-group">
                        <label for="correo">Correo</label>
                        <input type="email" id="correo" name="correo" placeholder="petito@hotmail.com" maxlength="100" required>
                    </div>

                    <div class="form-group">
                        <label for="documento">Documento</label>
                        <input type="text" id="documento" name="documento" placeholder="1021901" maxlength="20" required>
                    </div>

                    <div class="form-group">
                        <label for="telefono">Teléfono</label>
                        <input type="tel" id="telefono" name="telefono" placeholder="3001234567" maxlength="20" required>
                    </div>

                    <div class="form-group">
                        <label for="direccion">Direccion</label>
                        <input type="text" id="direccion" name="direccion" placeholder="cra 108 55b 16" maxlength="100" required>
                    </div>

                    <div class="form-group">
                        <label for="contrasena">Contraseña</label>
                        <input type="password" id="contrasena" name="contrasena" placeholder="Mínimo 8 caracteres" minlength="8" required>
                    </div>

                    <div class="form-group">
                        <label for="confirmar_contrasena">Confirmar contraseña</label>
                        <input type="password" id="confirmar_contrasena" name="confirmar_contrasena" placeholder="******" minlength="8" required>
                    </div>

                    <button type="submit" class="btn-submit">Registrar</button>

                </form>
            </div>
        </main>

        <!-- Franja Inferior (Pie de página) -->
        <footer class="footer-bar">
            <p>Contacto: info@veterinaria.com | Teléfono: 123-456-7890</p>
            <p>© 2026</p>
        </footer>

    </div>

</body>
</html>
